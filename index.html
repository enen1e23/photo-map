<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>📸 照片地图生成器 · 免费底图</title>

  <style>
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; height:100%;
      font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif; background:#f5f5f5; }
    .layout { display:flex; flex-direction:column; height:100vh; }

    .top-bar {
      padding:9px 14px; background:#fff;
      box-shadow:0 2px 6px rgba(0,0,0,0.1); z-index:10;
      display:flex; flex-wrap:wrap; align-items:center; gap:7px 12px;
    }
    .top-bar-title { font-size:16px; font-weight:700; white-space:nowrap; }
    .top-bar label  { font-size:13px; color:#555; }
    .top-bar input[type="text"] {
      padding:4px 8px; border-radius:4px; border:1px solid #ddd;
    }
    .top-bar input[type="file"] { font-size:13px; }
    .vd { width:1px; height:24px; background:#e0e0e0; flex-shrink:0; }

    .btn {
      padding:5px 10px; border-radius:5px; border:none; cursor:pointer;
      font-size:13px; font-weight:500; display:inline-flex; align-items:center; gap:3px;
      transition:filter .15s;
    }
    .btn:hover { filter:brightness(0.92); }
    .btn-green  { background:#43a047; color:#fff; }
    .btn-gray   { background:#e0e0e0; color:#333; }
    .btn-blue   { background:#1565C0; color:#fff; }
    .btn-red    { background:#e53935; color:#fff; }
    .btn-teal   { background:#00838f; color:#fff; }
    .btn-toggle {
      background:#e8f5e9; color:#2e7d32;
      border:1.5px solid #81c784;
    }
    .btn-toggle.on { background:#2e7d32; color:#fff; border-color:#2e7d32; }

    /* 加载进度条 */
    .progress-bar-wrap {
      display:none; position:absolute; bottom:0; left:0; right:0;
      height:4px; background:#e0e0e0; z-index:1000;
    }
    .progress-bar { height:100%; background:#1565C0; width:0%; transition:width .3s; }

    .status-text { font-size:12px; color:#666; margin-left:auto; white-space:nowrap; }
    .small-text  { font-size:11px; color:#aaa; }

    .content { flex:1; position:relative; }
    #map { width:100%; height:100%; }
    .leaflet-container { background:#d8e4ee; }

    /* 图层控件 */
    .leaflet-control-layers {
      border-radius:8px !important; border:none !important;
      box-shadow:0 2px 14px rgba(0,0,0,0.16) !important;
    }
    .leaflet-control-layers-expanded { padding:8px 12px !important; min-width:185px; }
    .leaflet-control-layers-base label,
    .leaflet-control-layers-overlays label { font-size:13px; margin:3px 0; }
    .leaflet-control-layers-separator { margin:6px 0 !important; }
    .leaflet-control-attribution { font-size:10px !important; }
    /* 在小屏幕上让工具栏正常折行，避免底图控件挡住全部地图 */
    @media (max-width:700px) {
      .top-bar { padding:8px; gap:6px; }
      .top-bar-title { width:100%; }
      .top-bar label { display:inline-flex; align-items:center; gap:4px; }
      .top-bar input[type="text"] { max-width:160px; }
      .top-bar input[type="file"] { max-width:155px; }
      .vd { display:none; }
      .status-text { width:100%; margin-left:0; white-space:normal; }
      .small-text { display:none; }
      .leaflet-control-layers-expanded { min-width:160px; }
    }
    .map-hint {
      position:absolute; left:50%; bottom:26px; transform:translateX(-50%);
      background:rgba(255,255,255,.96); color:#384657; border-radius:9px;
      box-shadow:0 2px 12px rgba(0,0,0,.15); padding:8px 13px;
      font-size:12px; line-height:1.5; z-index:950; max-width:min(520px,90%);
      display:none; pointer-events:none; text-align:center;
    }

    /* 区划标注 */
    .district-label {
      background:rgba(255,255,255,0.88); border:1px solid #1565C0;
      border-radius:4px; padding:2px 7px; font-size:12px; font-weight:600;
      color:#0d47a1; pointer-events:none; white-space:nowrap;
      box-shadow:0 1px 4px rgba(0,0,0,0.12);
    }
    .district-hover-tip {
      background:rgba(255,255,255,0.95); border:1px solid #e65100;
      border-radius:4px; padding:3px 8px; font-size:13px;
      color:#bf360c; pointer-events:none; white-space:nowrap;
    }

    /* 河流 tooltip */
    .river-tip {
      background:rgba(21,101,192,0.9); border:none;
      border-radius:4px; padding:3px 8px; font-size:12px;
      color:#fff; pointer-events:none; white-space:nowrap;
    }

    /* 照片弹窗 */
    .photo-popup { text-align:center; min-width:250px; }
    .photo-popup img { width:100%; max-width:400px; border-radius:8px; margin-bottom:10px;

    .photo-popup .info { font-size:13px; color:#555; line-height:1.6; }
    .photo-popup .info strong { color:#333; }
    .photo-marker {
      background:#43a047; border:3px solid #fff; border-radius:50%;
      width:30px; height:30px; display:flex; align-items:center; justify-content:center;
      color:#fff; font-weight:bold; font-size:12px;
      box-shadow:0 2px 6px rgba(0,0,0,0.3); cursor:pointer;
    }
    .leaflet-popup-content { margin:15px; }
  </style>

</div>

const AREA_ENTRIES = AREA_ROWS.trim().split("\n").map(row => {
  const i = row.indexOf(" ");
  return { code: row.slice(0, i), name: row.slice(i + 1) };
});
const AREA_BY_CODE = new Map(AREA_ENTRIES.map(x => [x.code, x]));
function normalizeAreaName(s) {
  return String(s).trim().replace(/\s+/g, "");
}
function areaShortName(name) {
  return name.replace(/(特别行政区|维吾尔自治区|壮族自治区|回族自治区|自治区|省|市|地区|盟)$/, "")
    .replace(/(蒙古族藏族自治州|土家族苗族自治州|哈尼族彝族自治州|朝鲜族自治州|土家族苗族自治州|藏族羌族自治州|彝族自治州|自治州)$/, "");
}
function matchArea(text) {
  const input = normalizeAreaName(text);
  if (/^\d{6}$/.test(input)) return AREA_BY_CODE.get(input) || {code:input, name: input};
  // 精确匹配优先，防止把「汕头」误匹配「汕尾」。
  const exact = AREA_ENTRIES.filter(x => x.name === input);
  if (exact.length === 1) return exact[0];
  if (exact.length > 1) return exact.find(x=>x.code.endsWith('0000')) || exact[0];
  const short = AREA_ENTRIES.filter(x => areaShortName(x.name) === input);
  if (short.length === 1) return short[0];
  if (short.length > 1) return null;
  // 支持输入部分名称，但仅在结果唯一时自动匹配。
  const partial = AREA_ENTRIES.filter(x => x.name.includes(input));
  return partial.length === 1 ? partial[0] : null;
}
const cityListEl = document.getElementById("cityList");
AREA_ENTRIES.forEach(x => {
  const opt = document.createElement("option"); opt.value = x.name;
  opt.label = x.code;
  cityListEl.appendChild(opt);
});

// ── 全局变量 ─────────────────────────────────────────────────────────────────
let map = null, markersLayer = null, pathLayer = null;
let districtLayer = null, labelMarkers = [], labelsVisible = false;
let riverLayer = null;
let currentPhotoInfos = [];   // 照片 GPS 统一使用 WGS-84，切换底图不必改变坐标

// ── 底图初始化 ──────────────────────────────────────────────────────────────
// 不使用高德和 GCJ-02 转换，照片点和 WGS84 底图共用同一坐标系。
// OpenFreeMap 为免费、免 API key 的矢量瓦片；其余为按需载入的栅格底图。
function showMapHint(message, duration = 6500) {
  const el = document.getElementById("mapHint");
  if (!el) return;
  el.textContent = message;
  el.style.display = "block";
  clearTimeout(showMapHint.timer);
  showMapHint.timer = setTimeout(() => { el.style.display = "none"; }, duration);
}
function initMapIfNeeded() {
  if (map) return;
  map = L.map("map", { minZoom: 2, maxZoom: 19, zoomControl: true })
    .setView([34.0, 108.0], 5);

  const osmAttribution = '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> 贡献者';
  const ofmAttribution = osmAttribution + ' · <a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a>';
  const streetFallback = L.tileLayer(
    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    { maxNativeZoom:19, maxZoom:19, attribution:osmAttribution }
  );
  const topo = L.tileLayer(
    "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
    { subdomains:"abc", maxNativeZoom:17, maxZoom:19,
      attribution:'© <a href="https://opentopomap.org" target="_blank" rel="noopener">OpenTopoMap</a> · ' + osmAttribution }
  );
  const satellite = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    { maxNativeZoom:18, maxZoom:19,
      attribution:'影像 © <a href="https://www.esri.com" target="_blank" rel="noopener">Esri</a>、影像数据提供方' }
  );

  const baseLayers = {};
  const supportsVector = (typeof L.maplibreGL === "function" &&
    typeof maplibregl !== "undefined" &&
    typeof maplibregl.supported === "function" && maplibregl.supported());
  let defaultLayer;
  if (supportsVector) {
    const liberty = L.maplibreGL({
      style:"https://tiles.openfreemap.org/styles/liberty", attribution:ofmAttribution
    });
    const positron = L.maplibreGL({
      style:"https://tiles.openfreemap.org/styles/positron", attribution:ofmAttribution
    });
    baseLayers["🏙️ 城市街道 · OpenFreeMap"] = liberty;
    baseLayers["◻️ 清爽简洁 · OpenFreeMap"] = positron;
    defaultLayer = liberty;

    // 如果服务器、矢量瓦片或 WebGL 异常，自动切回标准 OSM，而不是灰屏。
    for (const layer of [liberty, positron]) {
      layer.on("add", () => {
        const glMap = layer.getMaplibreMap && layer.getMaplibreMap();
        if (!glMap || layer._errorHandlerAdded) return;
        layer._errorHandlerAdded = true;
        let failures = 0;
        glMap.on("error", () => {
          if (!map.hasLayer(layer) || ++failures < 3) return;
          map.removeLayer(layer);
          if (!map.hasLayer(streetFallback)) streetFallback.addTo(map);
          showMapHint("OpenFreeMap 加载失败，已经自动换成标准街道地图。可以稍后重试。", 8500);
          document.getElementById("statusText").textContent = "已自动切换到备用底图（OpenStreetMap）。";
        });
        glMap.on("load", () => { failures = 0; });
      });
    }
  } else {
    defaultLayer = streetFallback;
    showMapHint("矢量底图组件未加载，已启用标准街道地图；请检查网络。", 8500);
  }
  baseLayers["🗺️ 标准街道 · OSM（备用）"] = streetFallback;
  baseLayers["⛰️ 地形等高线 · OpenTopoMap"] = topo;
  baseLayers["🛰️ 卫星影像 · Esri"] = satellite;

  defaultLayer.addTo(map);
  L.control.layers(baseLayers, null, {
    position:"topright", collapsed:window.innerWidth < 650
  }).addTo(map);

  // 影像和地形瓦片出错时给出说明：某些地区/缩放级别可能暂时缺瓦片。
  for (const layer of [topo, satellite, streetFallback]) {
    let errors = 0;
    layer.on("tileerror", () => {
      if (!map.hasLayer(layer)) return;
      if (++errors === 4) showMapHint("当前底图部分瓦片加载失败，可在右上角切换为标准街道或其他底图。", 8500);
    });
    layer.on("load", () => { errors = 0; });
  }

  // OpenFreeMap 无需额外绑定高德的坐标修正；只有区划/河流/照片需要正常叠加。
  map.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>');
}

// ── 清除函数 ─────────────────────────────────────────────────────────────────
function clearMapLayers() {
  if (markersLayer) { markersLayer.remove(); markersLayer = null; }
  if (pathLayer)    { pathLayer.remove();    pathLayer    = null; }
  currentPhotoInfos = [];
}

// ── 按照片原始 GPS 坐标绘制标记（WGS-84） ───────────────────────────────────
function rebuildPhotoMarkers() {
  if (!currentPhotoInfos.length) return;
  if (markersLayer) { markersLayer.remove(); markersLayer = null; }
  if (pathLayer)    { pathLayer.remove();    pathLayer    = null; }

  markersLayer = L.layerGroup().addTo(map);
  const pathCoords = [], markers = [];

  currentPhotoInfos.forEach((photo, idx) => {
    const [dispLat, dispLon] = [photo.lat, photo.lon];

    pathCoords.push([dispLat, dispLon]);
    const icon = L.divIcon({className:"photo-marker", html: idx+1, iconSize:[30,30]});
    let popup = '<div class="photo-popup">';
    if (photo.image) popup += `<img src="${photo.image}" alt="${photo.filename}">`;
    popup += '<div class="info">';
    popup += `<strong>📷 ${photo.filename}</strong><br>`;
    if (photo.datetime) popup += `🕐 ${photo.datetime}<br>`;
    if (photo.camera)   popup += `📱 ${photo.camera}<br>`;
    if (photo.altitude !== null && !isNaN(photo.altitude)) popup += `⛰️ 海拔: ${photo.altitude.toFixed(1)} m<br>`;
    popup += `📍 ${photo.lat.toFixed(6)}, ${photo.lon.toFixed(6)}`;
    popup += "</div></div>";
    const m = L.marker([dispLat, dispLon], {icon}).bindPopup(popup, {maxWidth:450}).addTo(markersLayer);
    markers.push(m);
  });

  if (pathCoords.length > 1)
    pathLayer = L.polyline(pathCoords, {color:"#FF5722", weight:3, opacity:0.7, dashArray:"10,10", lineJoin:"round"}).addTo(map);
}
function clearDistrict() {
  if (districtLayer) { districtLayer.remove(); districtLayer = null; }
  clearLabels();
}
function clearLabels() {
  labelMarkers.forEach(m => map && map.removeLayer(m));
  labelMarkers = [];
}
function clearRiver() {
  if (riverLayer) { riverLayer.remove(); riverLayer = null; }
}

// ── 标注开关 ─────────────────────────────────────────────────────────────────
function applyLabelVisibility(v) {
  labelsVisible = v;
  const btn = document.getElementById("toggleLabelBtn");
  if (v) {
    btn.classList.add("on"); btn.textContent = "🏷️ 标注 ✓";
    labelMarkers.forEach(m => m.addTo(map));
  } else {
    btn.classList.remove("on"); btn.textContent = "🏷️ 标注";
    labelMarkers.forEach(m => map.removeLayer(m));
  }
}

// ── 加载河流 GeoJSON（Natural Earth 50m） ────────────────────────────────────
// 数据源：Natural Earth ne_50m_rivers_lake_centerlines
// 包含全球主要河流，中国有长江、黄河、珠江、黑龙江、雅鲁藏布江等
async function loadRivers() {
  const status = document.getElementById("statusText");
  if (riverLayer) { alert("河流图层已加载，如需重置请先点击「✕ 清除河流」。"); return; }

  initMapIfNeeded();
  status.textContent = "⏳ 正在加载河流数据（约 800KB）…";

  // 显示进度条动画
  const wrap = document.getElementById("progressWrap");
  const bar  = document.getElementById("progressBar");
  wrap.style.display = "block";
  bar.style.width = "30%";

  const URL = "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_rivers_lake_centerlines.geojson";

  let geojson;
  try {
    bar.style.width = "60%";
    const res = await fetch(URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    bar.style.width = "85%";
    geojson = await res.json();
    bar.style.width = "100%";
  } catch(err) {
    wrap.style.display = "none";
    status.textContent = `❌ 河流数据加载失败：${err.message}`;
    alert(`河流数据加载失败，请检查网络连接。\n${err.message}`);
    return;
  }

  setTimeout(()=>{ wrap.style.display="none"; bar.style.width="0%"; }, 600);

  clearRiver();

  riverLayer = L.geoJSON(geojson, {
    // 按 scalerank / strokeweightvar 控制河流粗细
    // scalerank 越小 = 越大的河（1 = 长江/黄河级别）
    style(feature) {
      const rank = feature.properties.scalerank || 8;
      // 河流宽度：大河粗，支流细
      const weight  = rank <= 2 ? 3.5 : rank <= 4 ? 2.5 : rank <= 6 ? 1.5 : 0.9;
      const opacity = rank <= 2 ? 0.90 : rank <= 4 ? 0.80 : rank <= 6 ? 0.70 : 0.55;
      return {
        color:   "#1565C0",
        weight:  weight,
        opacity: opacity,
        lineCap: "round",
        lineJoin:"round",
      };
    },

    onEachFeature(feature, layer) {
      const name = feature.properties.name || feature.properties.name_en || "";
      const nameCN = feature.properties.name_zh || feature.properties.name || "";
      // 悬停显示河流名
      if (name) {
        layer.on("mouseover", function(e) {
          layer.bindTooltip(nameCN || name, {
            permanent: false, className:"river-tip", sticky:true
          }).openTooltip(e.latlng);
        });
        layer.on("mouseout", function() { layer.closeTooltip(); });
        layer.bindPopup(
          `<b style="font-size:14px">🌊 ${nameCN || name}</b>` +
          (feature.properties.name_en && feature.properties.name_en !== name
            ? `<br><span style="color:#666;font-size:12px">${feature.properties.name_en}</span>` : "")
        );
      }
    }
  }).addTo(map);

  const count = geojson.features ? geojson.features.length : 0;
  status.textContent = `✅ 河流图层已加载（共 ${count} 条河流，悬停可查看名称）`;
}

// ── 加载区划 ─────────────────────────────────────────────────────────────────
async function loadDistrict() {
  const input = document.getElementById("districtInput").value.trim();
  const status = document.getElementById("statusText");
  if (!input) { alert("请输入城市名称"); return; }

  const area = matchArea(input);
  if (!area) {
    status.textContent = `未找到或无法唯一确定“${input}”。请从下拉建议中选择完整名称，或输入六位区划代码。`;
    alert(`无法确定“${input}”对应的行政区划。\n请选择下拉建议中的完整名称，或直接输入六位区划代码。`);
    return;
  }
  const adcode = area.code;
  const areaName = area.name;

  status.textContent = `⏳ 已识别${areaName}（${adcode}），正在获取区划边界…`;
  initMapIfNeeded();

  let geojson;
  try {
    const res = await fetch(`https://geo.datav.aliyun.com/areas_v3/bound/${adcode}_full.json`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    geojson = await res.json();
  } catch(err) {
    status.textContent = `❌ 已找到${areaName}（${adcode}），但在线边界获取失败：${err.message}`; alert(`已找到${areaName}的区划编码：${adcode}。\n但无法获取在线区划边界，请检查网络或稍后重试。`); return;
  }

  if (!geojson || !Array.isArray(geojson.features) || !geojson.features.length) {
    status.textContent = `没有获取到${areaName}（${adcode}）的子区划数据。`;
    return;
  }
  clearDistrict();
  const palette = ["#1565C0","#2E7D32","#6A1B9A","#E65100","#00838F","#AD1457","#37474F","#558B2F"];
  let ci = 0; const cm = {};

  districtLayer = L.geoJSON(geojson, {
    style(f) {
      const n = f.properties.name||"";
      if (!cm[n]) cm[n] = palette[ci++ % palette.length];
      return { color:cm[n], weight:2, opacity:0.85, fillColor:cm[n], fillOpacity:0.07 };
    },
    onEachFeature(f, layer) {
      const name  = f.properties.name  || "未知";
      const level = f.properties.level || "";
      const adc   = f.properties.adcode|| "";
      const lvMap = {province:"省级",city:"地级市",district:"区县级",street:"乡镇级"};

      layer.on("mouseover", e => {
        layer.setStyle({fillOpacity:0.28, weight:3});
        layer.bindTooltip(name,{permanent:false,className:"district-hover-tip",direction:"center"})
          .openTooltip(e.latlng);
      });
      layer.on("mouseout", ()=>{ districtLayer.resetStyle(layer); layer.closeTooltip(); });
      layer.bindPopup(
        `<b style="font-size:14px">📍 ${name}</b><br>` +
        `<span style="font-size:12px;color:#666">` +
        (level ? `级别：${lvMap[level]||level}<br>`:"")+
        (adc   ? `区划码：${adc}`:"")+`</span>`
      );

      const center = layer.getBounds().getCenter();
      const lm = L.marker(center, {
        icon: L.divIcon({className:"",html:`<div class="district-label">${name}</div>`,iconSize:null,iconAnchor:[0,0]}),
        interactive:false, zIndexOffset:-500
      });
      labelMarkers.push(lm);
    }
  }).addTo(map);

  if (labelsVisible) labelMarkers.forEach(m => m.addTo(map));
  map.fitBounds(districtLayer.getBounds().pad(0.05));
  const count = geojson.features ? geojson.features.length : 0;
  status.textContent = `✅ 已加载${areaName}区划（共 ${count} 个子区域）`;
}

// ── EXIF ──────────────────────────────────────────────────────────────────────
function dmsToDecimal(dms, ref) {
  if (!dms||dms.length<3||!ref) return null;
  function tv(v) {
    if (typeof v==="number") return v;
    if (typeof v==="object"&&v.numerator!==undefined&&v.denominator) return v.numerator/v.denominator;
    if (typeof v==="string"){const p=v.split("/");if(p.length===2){const n=parseFloat(p[0]),d=parseFloat(p[1]);return!isNaN(n)&&!isNaN(d)&&d?n/d:NaN;}return isNaN(parseFloat(v))?NaN:parseFloat(v);}
    return NaN;
  }
  const d=tv(dms[0]),m=tv(dms[1]),s=tv(dms[2]);
  if([d,m,s].some(v=>isNaN(v))) return null;
  let dec=d+m/60+s/3600;
  if(/^[SW]$/i.test(String(ref))) dec=-dec;
  return dec;
}

function processFile(file) {
  return new Promise(resolve=>{
    const r=new FileReader();
    r.onload=e=>{
      let tags; try{tags=EXIF.readFromBinaryFile(e.target.result);}catch{resolve(null);return;}
      const lat=dmsToDecimal(tags.GPSLatitude,tags.GPSLatitudeRef);
      const lon=dmsToDecimal(tags.GPSLongitude,tags.GPSLongitudeRef);
      if(lat===null||lon===null||!Number.isFinite(lat)||!Number.isFinite(lon)){resolve(null);return;}
      const dt=tags.DateTimeOriginal||tags.DateTime||null;
      const mk=tags.Make||"",mo=tags.Model||"";
      const cam=mk&&mo?mk+" "+mo:mo||null;
      let alt=null;
      if(tags.GPSAltitude){const av=tags.GPSAltitude;alt=typeof av==="object"&&av.numerator!==undefined?av.numerator/av.denominator:typeof av==="number"?av:null;}
      const r2=new FileReader();
      r2.onload=ev=>resolve({lat,lon,filename:file.name,datetime:dt?String(dt):null,camera:cam?String(cam):null,altitude:alt,image:ev.target.result});
      r2.onerror=()=>resolve({lat,lon,filename:file.name,datetime:dt?String(dt):null,camera:cam?String(cam):null,altitude:alt,image:null});
      r2.readAsDataURL(file);
    };
    r.onerror=()=>resolve(null);
    r.readAsArrayBuffer(file);
  });
}

async function generateMapFromFiles(fileList) {
  const status=document.getElementById("statusText");
  if(!fileList||!fileList.length){alert("请先选择至少一张照片。");return;}
  status.textContent=`正在读取 ${fileList.length} 张照片的 EXIF 信息…`;
  const files=Array.from(fileList),photoInfos=[];
  let proc=0;
  for(const file of files){
    if(!file.type.startsWith("image/")){proc++;continue;}
    const info=await processFile(file);
    if(info) photoInfos.push(info);
    proc++;
    status.textContent=`已处理 ${proc}/${files.length} 张照片…`;
  }
  if(!photoInfos.length){status.textContent="未找到包含 GPS 信息的照片。";alert("没有发现带 GPS 坐标的照片。");return;}
  photoInfos.sort((a,b)=>(a.datetime||"").localeCompare(b.datetime||""));
  initMapIfNeeded(); clearMapLayers();
  currentPhotoInfos = photoInfos;

  // 定位到照片中心（使用原始 WGS-84 坐标）
  const cLat=photoInfos.reduce((s,p)=>s+p.lat,0)/photoInfos.length;
  const cLon=photoInfos.reduce((s,p)=>s+p.lon,0)/photoInfos.length;
  map.setView([cLat,cLon],12);

  // 绘制标记（使用原始 GPS 坐标，不做偏移变换）
  rebuildPhotoMarkers();

  if(markersLayer){
    const allMarkers=[];
    markersLayer.eachLayer(m=>allMarkers.push(m));
    if(allMarkers.length) map.fitBounds(L.featureGroup(allMarkers).getBounds().pad(0.1));
  }
  const title=document.getElementById("titleInput").value.trim()||"我的照片地图";
  status.textContent=`✅ 地图已生成：${title}（共 ${photoInfos.length} 张带 GPS 的照片）`;
  document.getElementById("dirInput").value="";
  document.getElementById("fileInput").value="";
}

// ── 事件绑定 ──────────────────────────────────────────────────────────────────
window.addEventListener("DOMContentLoaded",()=>{
  document.getElementById("titleInput").value="我的照片地图";

  document.getElementById("generateBtn").addEventListener("click",()=>{
    const df=document.getElementById("dirInput").files;
    const ff=document.getElementById("fileInput").files;
    if(df&&df.length) generateMapFromFiles(df);
    else if(ff&&ff.length) generateMapFromFiles(ff);
    else alert("请先选择照片。");
  });

  document.getElementById("clearBtn").addEventListener("click",()=>{
    document.getElementById("dirInput").value="";
    document.getElementById("fileInput").value="";
    clearMapLayers();
    if(map) map.setView([34.0,108.0],5);
    document.getElementById("statusText").textContent="已清空照片。";
  });

  document.getElementById("loadDistrictBtn").addEventListener("click",loadDistrict);
  document.getElementById("districtInput").addEventListener("keydown",e=>{if(e.key==="Enter")loadDistrict();});

  document.getElementById("clearDistrictBtn").addEventListener("click",()=>{
    clearDistrict(); labelsVisible=false;
    document.getElementById("toggleLabelBtn").classList.remove("on");
    document.getElementById("toggleLabelBtn").textContent="🏷️ 标注";
    document.getElementById("statusText").textContent="已清除区划图层。";
  });

  document.getElementById("toggleLabelBtn").addEventListener("click",()=>{
    if(!districtLayer){alert("请先加载区划边界。");return;}
    applyLabelVisibility(!labelsVisible);
  });

  document.getElementById("loadRiverBtn").addEventListener("click", loadRivers);

  document.getElementById("clearRiverBtn").addEventListener("click",()=>{
    clearRiver();
    document.getElementById("statusText").textContent="已清除河流图层。";
  });

  initMapIfNeeded();
});
</script>
